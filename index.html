<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Planeje uma reforma: defina o período, adicione etapas, atribua profissionais e veja tudo em um cronograma."
    />
    <title>Cronograma de Reforma</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%A8%3C/text%3E%3C/svg%3E"
    />
    <script>
      // Aplica o tema salvo antes da primeira renderização para evitar piscadas.
      try {
        var persisted = JSON.parse(localStorage.getItem('renovation-schedule') || 'null')
        var theme = persisted && persisted.state && persisted.state.theme
        if (theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (error) {
        /* ignore */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
